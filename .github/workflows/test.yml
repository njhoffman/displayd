name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']   # 3.11 is the minimum (tomllib)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install bats, shellcheck, just, pyflakes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats shellcheck just
          python -m pip install pyflakes
      - name: Lint
        run: just lint
      - name: Test
        run: just test
